<!doctype html>
<html lang="ta">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#1557b0" />
    <meta name="description" content="தமிழில் எளிய இஸ்லாமிய வாரிசுரிமை கணக்கீட்டு வழிகாட்டி" />
    <title>Islamic Inheritance Calculator</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/book-cover-icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/book-cover-apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700;800&family=Noto+Serif+Tamil:wght@600;700;800&family=Source+Sans+3:wght@400;600;700;800&family=Playfair+Display:wght@600;700;800&family=Source+Serif+4:wght@600;700;800&display=swap"
      rel="stylesheet" />
    <style>
      /* Instant splash: paints before the JS bundle loads so the app never shows a blank page. */
      #app-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: radial-gradient(120% 100% at 50% 0%, #123f7c 0%, #0b2a4f 60%, #071e3a 100%);
        color: #fff; font-family: "Noto Naskh Arabic", system-ui, sans-serif;
      }
      #app-splash .splash-ar { font-size: 52px; font-weight: 700; line-height: 1.5; }
      #app-splash .splash-name { font-size: 30px; font-weight: 800; letter-spacing: 0.05em; font-family: Inter, system-ui, sans-serif; }
      #app-splash .splash-sub { font-size: 11px; letter-spacing: 0.3em; opacity: 0.8; font-family: Inter, system-ui, sans-serif; }
    </style>
  </head>

  <body>
    <div id="app-splash" aria-hidden="true">
      <div class="splash-ar">الميراث</div>
      <div class="splash-name">Miraasu</div>
      <div class="splash-sub">ISLAMIC INHERITANCE CALCULATOR</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
